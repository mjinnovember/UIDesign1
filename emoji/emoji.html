<!DOCTYPE html>
<html lang="es">

<head>
  <title>Emoji Animation | Maria Jose Salas Flores</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="emo-style.css">
  <link rel="stylesheet" type="text/css" href="typography.css">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    #desktop {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      height: calc(100vh - 30px); /* Resta el espacio de la barra de tareas */
      padding: 0 !important;
    }
    #right-column {
      width: auto !important;
      padding: 0 !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
    }
    .window-photo {
      margin: 0 !important;
    }
  </style>
</head>

<body>

  <div id="taskbar">
    <div class="taskbar-left">
      <a href="../index.html" class="os-btn active" style="text-decoration: none; display: inline-block;"> Home</a>
      <button class="os-btn">Cooming soon</button>
      <button class="os-btn">Cooming soon</button>
      <button class="os-btn">+</button>
    </div>
    <div class="taskbar-right">
      <span id="system-time"></span>
    </div>
  </div>

  <div id="desktop">
    <div id="right-column"> 
      
      <div class="window window-photo" style="width: 480px; max-width: 90vw;">
        <div class="window-titlebar">
          <span class="title-text">EMOJI_VIEWER.EXE</span>
          <button class="close-btn" onclick="window.location.href='index.html'">&#x2715;</button>
        </div>
        <div class="window-content" style="background: #fff; padding: 20px; display: flex; justify-content: center; align-items: center;">
          <img src="Frame-1.gif" alt="Emoji Animation" style="width: 100%; height: auto; max-height: 400px; object-fit: contain;">
        </div>
      </div>

    </div>
  </div>

  <script>
    function updateClock() {
      const timeElement = document.getElementById('system-time');
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'AM' : 'PM';
      
      hours = hours % 12;
      hours = hours ? hours : 12;
      timeElement.textContent = `${day}/${month}/${year} ${hours}:${minutes} ${ampm}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
