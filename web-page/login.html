<!DOCTYPE html>
<html>

<head>
  <title>Login website</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="stylesheet-sign.css">
  <script type="text/javascript" src="validation-form.js" defer></script>
</head>

<body>

  <div class="split-container">
    <div class="visual-side">
      <div class="welcome-card">
        <div class="paper-clip">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </div>
        <h2 id="typing-text"></h2>
      </div>
    </div>

    <div class="wrapper">
      <h1>Login</h1>
      <p id="error-message"></p>
      <form id="form">
        <div>
          <label for="email-input">@</label>
          <input type="email" name="email" id="email-input" placeholder="Email">
        </div>
        <div>
          <label for="password-input">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="white"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm296.5-223.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/></svg>
          </label>
          <input type="password" name="password" id="password-input" placeholder="Password">
        </div>
        <button type="submit">Login</button>
      </form>
      <p>New here? <a href="signup.html">Create an Account</a></p>
    </div>
  </div>

</body>
</html>
